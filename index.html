<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpe Adria in bici — 2026</title>
<meta name="theme-color" content="#3b2f28">
<!-- NESSUN manifest qui: questa pagina non deve appartenere ad alcuno scope PWA. -->
<style>
  :root{
    --cream:#f3ead9; --cream-dark:#e8dcc4; --brown:#3b2f28; --brown-soft:#6b5a4d;
    --terracotta:#c1502e; --terracotta-dark:#9c3d21; --line:#b8ab8f;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; font-family:Georgia,'Times New Roman',serif; background:var(--cream); color:var(--brown); }
  body{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:28px 18px; text-align:center; }
  h1{ font-size:1.2rem; margin:0 0 6px; }
  p.sub{ font-size:0.82rem; color:var(--brown-soft); font-style:italic; margin:0 0 28px; }
  a.card{
    display:block; width:100%; max-width:340px; margin-bottom:16px; padding:20px 18px;
    border:2px solid var(--brown); border-radius:12px; background:#fffdf7; color:var(--brown);
    text-decoration:none; box-shadow:0 2px 5px rgba(0,0,0,0.2);
  }
  a.card:active{ background:var(--cream-dark); }
  a.card.alt{ border-color:var(--terracotta-dark); }
  a.card .t{ font-size:1.05rem; font-weight:bold; display:block; margin-bottom:4px; }
  a.card.alt .t{ color:var(--terracotta-dark); }
  a.card .d{ font-size:0.78rem; color:var(--brown-soft); }
  footer{ margin-top:30px; font-size:0.68rem; color:var(--brown-soft); }
</style>
</head>
<body>

<h1>Alpe Adria in bici</h1>
<p class="sub">agosto 2026 — installa le due app separatamente</p>

<a class="card" href="./mappa/">
  <span class="t">🗺️ Mappa</span>
  <span class="d">Itinerario, pensioni, candidate</span>
</a>

<a class="card alt" href="./update/">
  <span class="t">📍 Aggiorna posizione</span>
  <span class="d">Pagina privata — solo Andrea e Bea</span>
</a>

<footer>Apri una pagina e usa “Installa app” dal menu di Chrome.</footer>

</body>
</html>
